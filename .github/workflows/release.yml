name: Release
on:
  push:
    tags: ['v*-fork*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag to build
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - name: Verify release source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          expected="v$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "$expected"
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; never overwrite published assets.' >&2
            exit 1
          fi
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm test:fork
      - run: pnpm build
      - name: Pack and inspect
        run: |
          mkdir -p dist
          pnpm pack --out dist/
          archive="dist/dsh-better-sidebar-$(node -p "require('./package.json').version").tgz"
          tar -tzf "$archive" > dist/contents.txt
          test -s "$archive"
          tar -xOf "$archive" package/package.json | node --input-type=module -e 'let text=""; for await (const chunk of process.stdin) text+=chunk; const p=JSON.parse(text); if(p.name!=="dsh-better-sidebar" || p.version!==JSON.parse((await import("node:fs")).readFileSync("package.json","utf8")).version) process.exit(1); console.log(p.name,p.version);'
          for entry in lib/index.js lib/client.js lib/client-editor.js cordis.patch.yml; do
            tar -tzf "$archive" "package/$entry" >/dev/null
          done
          sha256sum "$archive" > dist/SHA256SUMS
      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.tgz dist/SHA256SUMS --verify-tag --title "$RELEASE_TAG" --notes 'Personal fork: asynchronous Cloudflare Access admission and mobile client disabled. Built by GitHub Actions; not published to npm. Browser and device acceptance is performed by the user.'
